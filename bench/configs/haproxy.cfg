global
    maxconn 4096

defaults
    mode http
    timeout connect 5s
    timeout client 300s
    timeout server 300s
    # No option http-buffer-request: the default is unbuffered, which is
    # what streaming needs. Left unset deliberately, not by oversight.

frontend http_in
    bind *:8080
    default_backend backends

backend backends
    # random(2) is HAProxy's power-of-two-choices, and its actual strong
    # default. Testing only `balance leastconn` here would be beating a
    # strawman: power-of-two is the config a competent operator would run,
    # and it's what least_requests / p2c in this router are meant to be
    # compared against on equal footing.
    balance random(2)

    server s1 127.0.0.1:8001 check
    server s2 127.0.0.1:8002 check
    server s3 127.0.0.1:8003 check
    server s4 127.0.0.1:8004 check
