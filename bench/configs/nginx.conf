worker_processes auto;

events {
    worker_connections 4096;
}

http {
    upstream backends {
        least_conn;  # nginx's real default is round-robin; the fair baseline
                     # for LLM traffic is least-connections, so pick it
                     # explicitly rather than compare against round-robin

        server 127.0.0.1:8001;
        server 127.0.0.1:8002;
        server 127.0.0.1:8003;
        server 127.0.0.1:8004;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://backends;

            # Default buffering destroys streaming latency: nginx waits for
            # the response to finish (or hit proxy_buffer_size) before
            # relaying anything to the client. A benchmark run with this on
            # would show a fake TTFT win over any router that actually
            # streams. This is the single most common way an LLM proxy
            # benchmark against nginx gets discredited.
            proxy_buffering off;
            proxy_request_buffering off;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Long enough for a slow generation to finish without nginx
            # cutting the stream.
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
